<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <!-- ISANA seal — isana_ds .hanko at 800px, SHUBUN: vermilion #D9432F glyph
       on a white field with the conventional border (border 2/30 of the box =
       53, drawn inset so it stays inside), radius 2/30, glyph 17/30 = 453,
       resting -3° press. Face 勇 is the FINAL M7 mark (BRAND_MANIFEST
       amendment 2, 2026-08-09) — a single-character motto seal, not a
       placeholder. Asset file: raw hex is the artwork, not a token layer. -->
  <rect x="0" y="0" width="800" height="800" rx="53" fill="#FFFFFF"/>
  <rect x="26.5" y="26.5" width="747" height="747" rx="26.5"
        fill="none" stroke="#D9432F" stroke-width="53"/>
  <text x="400" y="572" text-anchor="middle"
        font-family="Hiragino Mincho ProN, Yu Mincho, serif" font-size="453"
        fill="#D9432F" transform="rotate(-3 400 400)">勇</text>
</svg>
