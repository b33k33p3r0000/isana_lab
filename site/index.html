<title>ISANA — Daily plate № 0010</title>
<link rel="stylesheet" href="assets/isana.css">
<link rel="icon" href="assets/icons/favicon.ico">
<link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:var(--font-sans);font-size:var(--fs-body);line-height:1.55}
/* The ma: an otherwise empty page with the plate centered in it (manifest §6). */
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:var(--sp-10) var(--sp-5)}
/* Crest over sheet, as one column: the plate keeps the middle of the page and
   only shifts down by the crest plus the gap (manifest §6 amendment 2). The
   column STRETCHES its rows, so the sheet still resolves its own width against
   a real 560px box; the crest centers itself inside its row. */
.gate-stack{display:flex;flex-direction:column;width:min(560px,100%)}
/* ADD2 (amendment-3 addendum, 2026-08-12): the crest is the LOCKUP at masthead
   scale — the gate's old door-scale `.placard` override is gone, so the logo is
   one object at one size everywhere — and the gap to the sheet is 1 logo
   height. 144 px is the DS's `--logo-h` written out: the gate's own stylesheet
   spends CORE TOKENS only (its drift test resolves every var here against
   core.css), and --logo-h is a web-LAYER measure. */
.gate-crest{display:flex;justify-content:center;margin:0 0 144px}
.gate .plate{width:min(560px,100%)}
.plate-field{display:block;width:100%;height:auto;margin:var(--sp-5) 0 var(--sp-4)}
/* The anchor for the pressed stamp — the impression sits in the legend MARGIN
   and may break the frame line (manifest §5). */
.plate-legend{position:relative}
/* NOT `.row`: that is an isana_ds component (a hairline-separated row list)
   and reusing the name would draw a rule through the legend. */
.plate-row{margin:0}
.plate-row+.plate-row{margin-top:var(--sp-1);color:var(--ink-2)}
/* The way in, printed inside the frame. Ink, not accent: the sheet's one
   sanctioned vermilion is the stamp (manifest §5). */
.plate-enter{margin:var(--sp-4) 0 0;font-family:var(--font-mono);font-size:var(--fs-kicker);
  text-transform:uppercase;letter-spacing:var(--tracking-kicker)}
.plate-enter a{color:var(--n0-ink);text-decoration:none;
  border-bottom:1px solid var(--n0-ink);padding-bottom:2px}
/* The impression's own box (the `.seal-slot` pattern in `chrome`): `.hanko-
   stick` is absolutely positioned, so without a sized wrapper the offsets
   below would have nothing to measure from. Past the plate's own padding, so
   the stamp breaks the FRAME line — never the sheet edge (manifest §5). */
.plate-seal{position:absolute;width:30px;height:30px;
  right:calc(-1 * var(--sp-8));bottom:calc(-1 * var(--sp-2))}
@media (max-width:640px){.plate-seal{right:calc(-1 * var(--sp-4))}}
</style>
</head>
