<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:var(--font-sans);font-size:var(--fs-body);line-height:1.55}
/* The archive's ma: the sheet centered on an otherwise empty page, with the
   way back under it — a poster on a wall, and the caption below the frame. */
.sheet{min-height:100vh;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:var(--sp-5);padding:var(--sp-10) var(--sp-5)}
.sheet .plate{width:min(560px,100%)}
/* The way BACK, outside the frame. Ink, undecorated: the sheet's one
   sanctioned vermilion is the stamp (manifest §5), and this link is not even
   on the sheet. */
.sheet-back{margin:0;font-family:var(--font-mono);font-size:var(--fs-kicker);
  text-transform:uppercase;letter-spacing:var(--tracking-kicker)}
.sheet-back a{color:var(--ink-2);text-decoration:none;
  border-bottom:1px solid transparent;padding-bottom:2px}
.sheet-back a:hover,.sheet-back a:focus-visible{color:var(--ink);
  border-bottom-color:var(--hairline)}
.plate-field{display:block;width:100%;height:auto;margin:var(--sp-5) 0 var(--sp-4)}
/* The anchor for the pressed stamp — the impression sits in the legend MARGIN
   and may break the frame line (manifest §5). */
.plate-legend{position:relative}
/* NOT `.row`: that is an isana_ds component (a hairline-separated row list)
   and reusing the name would draw a rule through the legend. */
.plate-row{margin:0}
.plate-row+.plate-row{margin-top:var(--sp-1);color:var(--ink-2)}
/* Rule 12's one texture surface (manifest §9, "Posters / print"). The grain
   lies UNDER the content on the sheet ground; the marks and the legend sit
   above it and keep absolute N0. */
.sheet-grain{position:absolute;inset:0;width:100%;height:100%;z-index:0;
  border-radius:var(--radius);opacity:0.045;pointer-events:none}
.plate-top,.plate-field,.plate-legend{position:relative;z-index:1}
/* The impression's own box (the `.seal-slot` pattern in `chrome`): `.hanko-
   stick` is absolutely positioned, so without a sized wrapper the offsets
   below would have nothing to measure from. Past the plate's own padding, so
   the stamp breaks the FRAME line — never the sheet edge (manifest §5). */
.plate-seal{position:absolute;width:30px;height:30px;
  right:calc(-1 * var(--sp-8));bottom:calc(-1 * var(--sp-2))}
@media (max-width:640px){.plate-seal{right:calc(-1 * var(--sp-4))}}
@media print{
@page{size:A5;margin:10mm}
html,body{background:var(--ground);color:var(--ink)}
.gate,.sheet{min-height:0;display:block;padding:0}
.gate-stack{width:100%}
.gate .plate,.sheet .plate{margin:10mm;width:auto}
.gate-crest,.plate-enter,.sheet-back,.sheet-grain{display:none}
.plate{position:relative;box-shadow:none;page-break-inside:avoid}
.plate-top{position:static}
.plate::before,.plate::after,.plate-top::before,.plate-top::after{content:"";
  position:absolute;width:6mm;height:6mm;border:0 solid var(--hairline)}
.plate::before{top:-8mm;left:-8mm;border-right-width:1px;border-bottom-width:1px}
.plate::after{top:-8mm;right:-8mm;border-left-width:1px;border-bottom-width:1px}
.plate-top::before{bottom:-8mm;left:-8mm;border-right-width:1px;border-top-width:1px}
.plate-top::after{bottom:-8mm;right:-8mm;border-left-width:1px;border-top-width:1px}
.plate-seal,.hanko{-webkit-print-color-adjust:exact;print-color-adjust:exact}
/* the block closes here; a nested at-rule above is fine — the test that reads
   this block counts braces rather than splitting on the first closing one */
}
</style>
</head>
